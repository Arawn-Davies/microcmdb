# Jekyll configuration for the microCMDB documentation site.
# Served by GitHub Pages from the /docs folder of the main branch.

title: microCMDB
description: A lightweight CMDB-style configuration manager for home networks.

# Public URL. This is a *project* site published under the owner's apex domain,
# so it lives at https://arawn-davies.co.uk/microcmdb.
#   - url     = the scheme + apex domain (owned by the Arawn-Davies.github.io repo)
#   - baseurl = the project path (this repository's name)
url: https://arawn-davies.co.uk
baseurl: /microcmdb

# Documentation theme (pulled in at build time via the jekyll-remote-theme plugin,
# which is whitelisted on GitHub Pages).
remote_theme: just-the-docs/just-the-docs
color_scheme: dark
search_enabled: true

aux_links:
  "View on GitHub":
    - "https://github.com/Arawn-Davies/microcmdb"
aux_links_new_tab: true

plugins:
  - jekyll-remote-theme

# Keep the binary dissertation deliverables out of the rendered nav/search but
# still copy them through so they remain downloadable from the published site.
include:
  - "*.docx"
  - "*.pdf"
