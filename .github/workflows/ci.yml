name: CI

# Replaces the previous AppVeyor pipeline: restore and build the CLI and Web
# projects across Windows, Ubuntu and macOS on every push to main and on PRs.
# (microCMDB.OS is excluded — it's a Cosmos-kernel project that won't build in
# stock CI.)
on:
  push:
    branches: [ main ]
    # Skip the build when only docs/markdown change (no source affected).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The CLI targets net6.0 and Web targets net7.0; both build on the
          # .NET 8 SDK, which restores the matching targeting packs on demand.
          dotnet-version: 8.0.x

      # --- microCMDB.CLI (net6.0) ---
      - name: Restore CLI
        run: dotnet restore microCMDB.CLI/microCMDB.CLI.csproj

      - name: Build CLI
        run: dotnet build microCMDB.CLI/microCMDB.CLI.csproj -c Release --no-restore

      - name: Publish CLI
        run: dotnet publish microCMDB.CLI/microCMDB.CLI.csproj -c Release --no-build -o publish/cli

      - name: Upload published CLI
        uses: actions/upload-artifact@v4
        with:
          name: microCMDB.CLI-${{ matrix.os }}
          path: publish/cli

      # --- microCMDB.Web (net7.0) ---
      - name: Restore Web
        run: dotnet restore microCMDB.Web/microCMDB.Web.csproj

      - name: Build Web
        run: dotnet build microCMDB.Web/microCMDB.Web.csproj -c Release --no-restore
